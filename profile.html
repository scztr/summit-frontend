<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Профіль — Summit</title>
</head>
<body>
    <nav>
        <a href="index.html">Каталог</a>
        <span id="user-name"></span>
        <button id="logout-button" type="button" hidden>Вийти</button>
    </nav>

    <h1>Мій профіль</h1>
    <p id="message" role="status">Завантаження...</p>

    <div id="profile" hidden>
        <p>Ім’я користувача: <span id="username"></span></p>
        <p>Ім’я: <span id="first-name"></span></p>
        <p>Прізвище: <span id="last-name"></span></p>
        <p>Email: <span id="email"></span></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="auth.js"></script>
    <script src="profile.js"></script>
</body>
</html>
